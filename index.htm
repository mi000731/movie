<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>電影票核銷模擬 (上下切割橫向拖動)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            /* ========================================================= */
            /* ★ 可修改設定區 ★ */
            /* 拖曳範圍的起始與結束 Y 座標 (可隨時微調) */
            --drag-start-y: 130px;
            --drag-end-y: 700px;
            /* 拖拉時露出的背景顏色 */
            --drag-bg-color: #f5f1f5;
            /* ========================================================= */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100%;
            height: 100%;
            height: 100dvh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* 鎖死瀏覽器原生的所有滑動行為(包含上下更新與左右上一頁) */
            overscroll-behavior: none; 
            touch-action: none;
            overflow-x: hidden; /* 防止產生水平捲軸造成的寬度計算誤差 */
        }
        
        html {
            background-color: #000;
            width: 100%;
            height: 100%;
        }

        .phone-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #fff;
            overflow: hidden;
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent;
        }

        /* 視覺切割容器共用設定 (改為上、中、下三塊) */
        .split-container {
            position: absolute;
            left: 0;
            right: 0;
            overflow: hidden; 
        }

        /* 上半部：固定不動 */
        .top-part {
            top: 0;
            height: var(--drag-start-y);
            z-index: 3;
        }

        /* 中間部：包含可拖拉的區域 */
        .middle-part {
            top: var(--drag-start-y);
            height: calc(var(--drag-end-y) - var(--drag-start-y));
            z-index: 2;
            background-color: var(--drag-bg-color); /* 拖拉露出的底色 */
        }

        /* 下半部：固定不動 */
        .bottom-part {
            top: var(--drag-end-y);
            bottom: 0;
            z-index: 1;
        }

        /* 可拖曳的包裹層 (只在中間段有作用) */
        .drag-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            will-change: transform;
            transform-origin: center center;
        }

        /* 完整的畫面內容 (滿版) */
        .full-content {
            position: absolute;
            left: 0;
            width: 100%; /* 改用 100% 避免 vw 產生的子像素黑線問題 */
            height: 100vh;
            height: 100dvh;
            pointer-events: none; 
        }

        /* 確保各區塊內的圖片往上推移對齊，拼湊成完整畫面 */
        .top-part .full-content {
            top: 0;
        }
        .middle-part .full-content {
            top: calc(-1 * var(--drag-start-y));
        }
        .bottom-part .full-content {
            top: calc(-1 * var(--drag-end-y));
        }

        /* 滿版底圖 */
        .base-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 黑底遮罩特效 */
        .backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s ease-out;
            z-index: 10;
        }
        .backdrop.show { opacity: 1; }

        /* 對話框覆蓋層 */
        .dialog-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; 
            z-index: 20;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        }
        .dialog-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 0; right: 0;
            width: 25%; height: 12%;
            z-index: 50; 
            cursor: default; 
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- 整個容器都是事件觸發區 -->
    <div class="phone-container" id="container">
        
        <!-- ================= 上半部 (固定) ================= -->
        <div class="split-container top-part">
            <div class="full-content">
                <img src="1.jpg" id="topMainImage" class="base-image" alt="背景畫面">
                <div class="backdrop" id="topBackdrop"></div>
                <img src="" id="topDialog" class="dialog-overlay" alt="對話框">
            </div>
        </div>

        <!-- ================= 中間部 (可拖拉區間) ================= -->
        <div class="split-container middle-part">
            <div class="drag-wrapper" id="scrollContent">
                <div class="full-content">
                    <img src="1.jpg" id="middleMainImage" class="base-image" alt="背景畫面">
                    <div class="backdrop" id="middleBackdrop"></div>
                    <img src="" id="middleDialog" class="dialog-overlay" alt="對話框">
                </div>
            </div>
        </div>

        <!-- ================= 下半部 (固定) ================= -->
        <div class="split-container bottom-part">
            <div class="full-content">
                <img src="1.jpg" id="bottomMainImage" class="base-image" alt="背景畫面">
                <div class="backdrop" id="bottomBackdrop"></div>
                <img src="" id="bottomDialog" class="dialog-overlay" alt="對話框">
            </div>
        </div>

        <!-- 右下角隱藏全螢幕按鈕 -->
        <div class="fullscreen-btn" id="fullscreenBtn"></div>
    </div>

    <script>
        const container = document.getElementById('container');
        const scrollContent = document.getElementById('scrollContent');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // 自動從 CSS :root 中讀取設定變數作為 JS 判斷依據
        const rootStyles = getComputedStyle(document.documentElement);
        const DRAG_START_Y = parseInt(rootStyles.getPropertyValue('--drag-start-y').trim());
        const DRAG_END_Y = parseInt(rootStyles.getPropertyValue('--drag-end-y').trim());

        // 取得上、中、下三個區塊的元素，以同步狀態
        const topMainImage = document.getElementById('topMainImage');
        const topBackdrop = document.getElementById('topBackdrop');
        const topDialog = document.getElementById('topDialog');

        const middleMainImage = document.getElementById('middleMainImage');
        const middleBackdrop = document.getElementById('middleBackdrop');
        const middleDialog = document.getElementById('middleDialog');

        const bottomMainImage = document.getElementById('bottomMainImage');
        const bottomBackdrop = document.getElementById('bottomBackdrop');
        const bottomDialog = document.getElementById('bottomDialog');
        
        // 預先載入圖片
        const img3 = new Image(); img3.src = '3.png';
        const img4 = new Image(); img4.src = '4.jpg';

        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            const docEl = document.documentElement; 
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // --- 橫向拖動與橡皮筋回彈 (X軸) 邏輯 ---
        let startX = 0;
        let currentTranslate = 0;
        let isDragging = false;
        let isSignificantDrag = false; 

        const startDrag = (x) => {
            startX = x;
            isDragging = true;
            scrollContent.style.transition = 'none';
        };

        const moveDrag = (x) => {
            if (!isDragging) return;
            const deltaX = x - startX;

            // 只要 X 軸移動超過 5px，就判定是拖曳，不要觸發點擊核銷
            if (Math.abs(deltaX) > 5) {
                isSignificantDrag = true;
            }

            // 加入摩擦力 (0.4) 產生橡皮筋左右拉扯感
            currentTranslate = deltaX * 0.4;
            scrollContent.style.transform = `translateX(${currentTranslate}px)`;
        };

        const endDrag = () => {
            if (!isDragging) return;
            isDragging = false;
            
            // X軸平滑回彈特效
            scrollContent.style.transition = 'transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1)';
            scrollContent.style.transform = `translateX(0px)`;
        };

        // 檢查是否允許拖曳 (只有狀態 0 和 3 允許，也就是 1.jpg 和 4.jpg 的時候)
        const canDrag = () => {
            return currentStep === 0 || currentStep === 3;
        };

        // 觸控事件綁定
        container.addEventListener('touchstart', (e) => {
            isSignificantDrag = false; // 每次觸碰螢幕先重置拖拉判斷
            if (!canDrag()) return; // 狀態不允許時，直接略過不處理拖曳

            // 限制：只要手指起始位置大於 DRAG_START_Y (130px 以下)，即可觸發拖拉
            // (0 ~ 130px 區間的左右滑動不會有反應)
            const touchY = e.touches[0].clientY;
            if (e.touches.length === 1 && touchY >= DRAG_START_Y) {
                startDrag(e.touches[0].clientX);
            }
        }, { passive: true });
        
        container.addEventListener('touchmove', (e) => {
            if(isDragging) moveDrag(e.touches[0].clientX);
        }, { passive: true });
        
        container.addEventListener('touchend', endDrag);

        // 電腦滑鼠測試事件綁定
        container.addEventListener('mousedown', (e) => {
            isSignificantDrag = false;
            if (!canDrag()) return; // 狀態不允許時，直接略過
            
            // 限制：只要滑鼠起始位置大於 DRAG_START_Y (130px 以下)，即可觸發拖拉
            if (e.clientY >= DRAG_START_Y) {
                startDrag(e.clientX);
            }
        });
        container.addEventListener('mousemove', (e) => {
            if(isDragging) moveDrag(e.clientX);
        });
        window.addEventListener('mouseup', endDrag);

        // --- 狀態同步邏輯 (同步更新上、中、下三等分的圖形) ---
        let currentStep = 0;

        container.addEventListener('click', () => {
            // 如果剛剛使用者在拖拉，阻擋點擊觸發
            if (isSignificantDrag) return; 

            if (currentStep === 0) {
                // 【第 1 次點擊】同步顯示對話框
                topDialog.src = '2.png';
                middleDialog.src = '2.png';
                bottomDialog.src = '2.png';
                
                topBackdrop.classList.add('show');
                middleBackdrop.classList.add('show');      
                bottomBackdrop.classList.add('show');      
                
                topDialog.classList.add('show');   
                middleDialog.classList.add('show');   
                bottomDialog.classList.add('show');   
                
                currentStep = 1;
            } 
            else if (currentStep === 1) {
                // 【第 2 次點擊】同步切換按下狀態
                topDialog.src = '3.png';
                middleDialog.src = '3.png';
                bottomDialog.src = '3.png';
                currentStep = 2;

                setTimeout(() => {
                    topBackdrop.classList.remove('show');    
                    middleBackdrop.classList.remove('show'); 
                    bottomBackdrop.classList.remove('show'); 
                    
                    topDialog.classList.remove('show'); 
                    middleDialog.classList.remove('show'); 
                    bottomDialog.classList.remove('show'); 
                    
                    setTimeout(() => {
                        // 同步切換最終完成圖片
                        topMainImage.src = '4.jpg';          
                        middleMainImage.src = '4.jpg';          
                        bottomMainImage.src = '4.jpg';          
                        currentStep = 3;                  
                    }, 200); 
                }, 200); 
            }
        });
    </script>

</body>
</html>
