<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover 強制讓畫面延伸到瀏海/動態島區域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>電影票核銷模擬 (純圖片流程)</title>
    
    <!-- 新增：Web App Manifest，強制 iOS/Android 進入全螢幕 -->
    <link rel="manifest" href="manifest.json">

    <!-- 允許將網頁加入主畫面並以全螢幕 (App模式) 執行，隱藏網址列 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f1f5">

    <style>
        /* === 【設定區】 === */
        :root {
            --drag-start-y: 110px;      /* 拖曳區域的起始 Y 軸 (低於此數值才會觸發) */
            --drag-end-y: 700px;        /* 拖曳區域的結束 Y 軸 (目前邏輯不限制底部) */
            --drag-bg-color: #f5f1f5;   /* 拖拉露出的底色 */
        }
        /* ================ */

        body {
            margin: 0;
            padding: 0;
            background-color: #f5f1f5; /* 更改為與 App 相同的底色 */
            width: 100%;
            height: 100vh;
            height: 100dvh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* 鎖死瀏覽器原生的所有滑動行為(包含上下更新與左右上一頁) */
            overscroll-behavior: none; 
            touch-action: none;
            overflow-x: hidden;

            /* 新增：防止久按反白與跳出原生選單 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html {
            background-color: #f5f1f5; /* 更改為與 App 相同的底色 */
            width: 100%;
            height: 100%;
        }

        /* 新增：禁止所有圖片的原生拖曳行為，避免長按被判定為要存圖 */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
        }

        .phone-container {
            position: relative; 
            width: 100%;
            height: 100%;
            background-color: #f5f1f5;
            overflow: hidden;
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent;
        }

        /* 視覺切割容器共用設定 (改為上、中、下三塊) */
        .split-container {
            position: absolute;
            left: 0;
            right: 0;
            overflow: hidden; 
            z-index: 1; /* 設定底圖層級 */
        }

        /* 頂部：固定不動 */
        .top-part {
            top: 0;
            height: var(--drag-start-y);
        }

        /* 中間：包含可拖拉的區域 */
        .middle-part {
            top: var(--drag-start-y);
            height: calc(var(--drag-end-y) - var(--drag-start-y));
            background-color: var(--drag-bg-color); /* 拖拉露出的底色 */
        }

        /* 底部：固定不動 */
        .bottom-part {
            top: var(--drag-end-y);
            bottom: 0;
        }

        /* 可拖曳的包裹層 (只在中間段有作用) */
        .drag-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            will-change: transform;
            transform-origin: center center;
        }

        /* 完整的畫面內容 (滿版) */
        .full-content {
            position: absolute;
            left: 0;
            width: 100%; /* 改用 100% 避免 vw 產生的子像素黑線問題 */
            height: var(--app-height, 100dvh); /* 使用 JS 動態計算的精準高度 */
            pointer-events: none; 
        }

        /* 確保各區塊內的圖片往上推移對齊，拼湊成完整畫面 */
        .top-part .full-content {
            top: 0;
        }
        .middle-part .full-content {
            top: calc(-1 * var(--drag-start-y));
        }
        .bottom-part .full-content {
            top: calc(-1 * var(--drag-end-y));
        }

        /* 滿版底圖 */
        .base-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: translateY(10px); /* 將底圖整體向下位移 10px */
        }

        /* 統一的黑底遮罩特效 (放在最外層) */
        .global-backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.2s ease-out;
            z-index: 10; /* 層級蓋過所有切割圖片 */
            pointer-events: none;
        }
        .global-backdrop.show { opacity: 1; }

        /* 統一的對話框覆蓋層 (放在最外層) */
        .global-dialog-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; 
            z-index: 20; /* 層級最高 */
            opacity: 0;
            /* 配合最終 1.2 倍，將彈出前狀態調整為 1.3 */
            transform: scale(1.2); 
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            pointer-events: none;
        }
        .global-dialog-overlay.show {
            opacity: 1;
            /* 顯示時縮放至原本大小的 1.2 倍 (1.5倍的80%) */
            transform: scale(1.09); 
        }

        /* 左上角隱形返回熱區 */
        .top-left-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 90px;
            z-index: 50; /* 層級最高，優先感應點擊 */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 0.jpg 滿版覆蓋層 */
        .zero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 60; /* 蓋在最上面 */
            opacity: 0;
            pointer-events: none; /* 預設無法點擊 */
            transition: opacity 0.2s ease;
        }
        .zero-overlay.show {
            opacity: 1;
            pointer-events: auto; /* 顯示時才允許點擊 */
        }

        /* 隱藏的全螢幕按鈕 */
        .fullscreen-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 25%;
            height: 12%;
            z-index: 50;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="phone-container" id="container">

        <!-- 左上角返回區塊 -->
        <div class="top-left-zone" id="topLeftZone"></div>

        <!-- 0.jpg 滿版覆蓋層 -->
        <img src="0.jpg" id="zeroOverlay" class="zero-overlay" alt="列表頁">

        <!-- ================= 圖片切割區 ================= -->
        <div class="split-container top-part">
            <div class="full-content">
                <img src="1.jpg" id="topMainImage" class="base-image" alt="背景畫面">
            </div>
        </div>

        <div class="split-container middle-part">
            <div class="drag-wrapper" id="scrollContent">
                <div class="full-content">
                    <img src="1.jpg" id="middleMainImage" class="base-image" alt="背景畫面">
                </div>
            </div>
        </div>

        <div class="split-container bottom-part">
            <div class="full-content">
                <img src="1.jpg" id="bottomMainImage" class="base-image" alt="背景畫面">
            </div>
        </div>
        <!-- ============================================== -->

        <!-- 統一的遮罩與對話框 (覆蓋在最上層) -->
        <div class="global-backdrop" id="globalBackdrop"></div>
        <img src="" id="globalDialog" class="global-dialog-overlay" alt="對話框">

        <!-- 右下角隱藏全螢幕按鈕 -->
        <div class="fullscreen-btn" id="fullscreenBtn"></div>
    </div>

    <script>
        const container = document.getElementById('container');
        const scrollContent = document.getElementById('scrollContent');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // 動態計算精準的容器高度，避免 100dvh 在部分手機瀏覽器縮放時產生底部黑邊
        const updateAppHeight = () => {
            const h = container.clientHeight;
            document.documentElement.style.setProperty('--app-height', `${h}px`);
        };
        window.addEventListener('resize', updateAppHeight);
        updateAppHeight(); 
        
        // 解決 iOS 加入主畫面後，初期 100dvh 計算延遲的問題
        setTimeout(updateAppHeight, 100);
        setTimeout(updateAppHeight, 300);

        // 自動從 CSS :root 中讀取設定變數作為 JS 判斷依據
        const rootStyles = getComputedStyle(document.documentElement);
        const DRAG_START_Y = parseInt(rootStyles.getPropertyValue('--drag-start-y').trim());

        // 取得三個區塊的底圖
        const topMainImage = document.getElementById('topMainImage');
        const middleMainImage = document.getElementById('middleMainImage');
        const bottomMainImage = document.getElementById('bottomMainImage');

        // 取得統一的遮罩與對話框
        const globalBackdrop = document.getElementById('globalBackdrop');
        const globalDialog = document.getElementById('globalDialog');
        
        const topLeftZone = document.getElementById('topLeftZone');
        const zeroOverlay = document.getElementById('zeroOverlay');

        // 預先載入圖片
        const img3 = new Image(); img3.src = '3.png';
        const img4 = new Image(); img4.src = '4.jpg';
        const img0 = new Image(); img0.src = '0.jpg';

        // --- 全螢幕控制邏輯 ---
        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            const docEl = document.documentElement; 
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // 新增：全面禁用滑鼠右鍵與手機長按跳出的選單 (Context Menu)
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 點擊左上角熱區 (顯示 0.jpg)
        topLeftZone.addEventListener('click', (e) => {
            e.stopPropagation(); 
            zeroOverlay.classList.add('show');
        });

        // 點擊 0.jpg 畫面任意區域 (隱藏 0.jpg 並重置狀態)
        zeroOverlay.addEventListener('click', (e) => {
            e.stopPropagation(); // 攔截點擊，不觸發下方 container 的核銷
            zeroOverlay.classList.remove('show');
            
            // 強制重置回初始狀態 (回到 1.jpg)
            currentStep = 0;
            topMainImage.src = '1.jpg';          
            middleMainImage.src = '1.jpg';          
            bottomMainImage.src = '1.jpg';
            
            // 確保隱藏所有對話框與遮罩
            globalBackdrop.classList.remove('show');    
            globalDialog.classList.remove('show'); 
            
            // 確保拖曳位移歸零
            scrollContent.style.transition = 'none';
            scrollContent.style.transform = `translateX(0px)`;
            currentTranslate = 0;
        });


        // --- 拖動核心邏輯 (加入橡皮筋回彈效果) ---
        let isDragging = false;
        let isSignificantDrag = false; 
        let startX = 0;
        let startY = 0; 
        let currentTranslate = 0;
        let touchStartedInDragZone = false; 

        // 判斷當下狀態是否允許拖拉 (只有 1.jpg 與 4.jpg 可以，有對話框時鎖死)
        const canDrag = () => {
            return currentStep === 0 || currentStep === 3;
        };

        const handleStart = (clientX, clientY) => {
            if (!canDrag()) return; 

            // 判斷第一下點擊是否在 DRAG_START_Y 以下 (例如 130px 以下)
            if (clientY >= DRAG_START_Y) {
                touchStartedInDragZone = true;
                isDragging = true;
                isSignificantDrag = false;
                startX = clientX;
                startY = clientY;
                scrollContent.style.transition = 'none'; 
            } else {
                touchStartedInDragZone = false;
            }
        };

        const handleMove = (clientX, clientY) => {
            if (!isDragging || !touchStartedInDragZone || !canDrag()) return;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                isSignificantDrag = true;
            }

            // 加入阻力效果 (0.4) 產生橡皮筋感
            currentTranslate = deltaX * 0.4;
            scrollContent.style.transform = `translateX(${currentTranslate}px)`;
        };

        const handleEnd = () => {
            if (!isDragging || !canDrag()) return;
            isDragging = false;
            touchStartedInDragZone = false;

            // 放開手指時，觸發物理回彈動畫
            scrollContent.style.transition = 'transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1)';
            scrollContent.style.transform = `translateX(0px)`;
            
            setTimeout(() => {
                isSignificantDrag = false;
                currentTranslate = 0;
            }, 50);
        };

        // 綁定觸控與滑鼠事件
        container.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        container.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        container.addEventListener('touchend', handleEnd);

        container.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleEnd);


        // --- 狀態同步邏輯 (同步更新三等分的圖形與全域特效) ---
        let currentStep = 0;

        container.addEventListener('click', () => {
            // 如果剛剛使用者在拖拉，阻擋點擊觸發
            if (isSignificantDrag) return; 

            if (currentStep === 0) {
                // 【第 1 次點擊】顯示全域對話框與遮罩
                globalDialog.src = '2.png';
                globalBackdrop.classList.add('show');      
                globalDialog.classList.add('show');   
                
                currentStep = 1;
            } 
            else if (currentStep === 1) {
                // 【第 2 次點擊】切換按下狀態
                globalDialog.src = '3.png';
                currentStep = 2;

                setTimeout(() => {
                    globalBackdrop.classList.remove('show');    
                    globalDialog.classList.remove('show'); 
                    
                    setTimeout(() => {
                        // 同步切換最終完成圖片
                        topMainImage.src = '4.jpg';          
                        middleMainImage.src = '4.jpg';          
                        bottomMainImage.src = '4.jpg';          
                        currentStep = 3;                  
                    }, 200); 
                }, 200); 
            }
        });
    </script>

</body>
</html>
