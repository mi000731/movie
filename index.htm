<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>電影票核銷模擬 (上下切割橫向拖動)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            /* ========================================================= */
            /* ★ 可修改設定區 ★ */
            /* 拖曳範圍的起始 Y 座標 (可隨時微調) */
            --drag-start-y: 100px;
            /* 拖拉時露出的背景顏色 */
            --drag-bg-color: #f5f1f5;
            /* ========================================================= */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100%;
            height: 100vh;
            height: 100dvh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* 鎖死瀏覽器原生的所有滑動行為(包含上下更新與左右上一頁) */
            overscroll-behavior: none; 
            touch-action: none;
            overflow-x: hidden; /* 防止產生水平捲軸造成的寬度計算誤差 */
        }
        
        html {
            background-color: #000;
            width: 100%;
            height: 100%;
        }

        .phone-container {
            position: relative; /* 改回 relative，確保跟隨 body 真實高度 */
            width: 100%;
            height: 100%;
            background-color: #fff;
            overflow: hidden;
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent;
        }

        /* 視覺切割容器共用設定 (改為上、下兩塊) */
        .split-container {
            position: absolute;
            left: 0;
            right: 0;
            overflow: hidden; 
        }

        /* 上半部：固定不動 */
        .top-part {
            top: 0;
            height: var(--drag-start-y);
            z-index: 3;
        }

        /* 下半部：包含可拖拉的區域 */
        .bottom-part {
            top: var(--drag-start-y);
            bottom: 0;
            z-index: 2;
            background-color: var(--drag-bg-color); /* 拖拉露出的底色 */
        }


        /* 可拖曳的包裹層 (只在下半部有作用) */
        .drag-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            will-change: transform;
            transform-origin: center center;
        }

        /* 完整的畫面內容 (滿版) */
        .full-content {
            position: absolute;
            left: 0;
            width: 100%; /* 改用 100% 避免 vw 產生的子像素黑線問題 */
            height: var(--app-height, 100dvh); /* 使用 JS 動態計算的精準高度 */
            pointer-events: none; 
        }

        /* 確保各區塊內的圖片往上推移對齊，拼湊成完整畫面 */
        .top-part .full-content {
            top: 0;
        }
        .bottom-part .full-content {
            top: calc(-1 * var(--drag-start-y));
        }

        /* 滿版底圖 */
        .base-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 黑底遮罩特效 */
        .backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s ease-out;
            z-index: 10;
        }
        .backdrop.show { opacity: 1; }

        /* 對話框覆蓋層 */
        .dialog-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; 
            z-index: 20;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        }
        .dialog-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        /* 0.jpg 滿版覆蓋層 */
        .zero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 40; /* 層級介於切割容器與全螢幕按鈕之間 */
            opacity: 0;
            pointer-events: none; /* 預設不阻擋點擊 */
            transition: opacity 0.2s ease-out;
        }
        .zero-overlay.show {
            opacity: 1;
            pointer-events: auto; /* 顯示時攔截所有點擊事件 */
        }

        /* 左上角點擊觸發區 (模擬返回按鈕區域) */
        .top-left-zone {
            position: absolute;
            top: 0; left: 0;
            width: 100px;
            height: 90px;
            z-index: 35;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 0; right: 0;
            width: 25%; height: 12%;
            z-index: 50; 
            cursor: default; 
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- 整個容器都是事件觸發區 -->
    <div class="phone-container" id="container">
        
        <!-- 左上角返回區塊 -->
        <div class="top-left-zone" id="topLeftZone"></div>

        <!-- 0.jpg 滿版覆蓋層 -->
        <img src="0.jpg" id="zeroOverlay" class="zero-overlay" alt="列表頁">

        <!-- ================= 上半部 (固定) ================= -->
        <div class="split-container top-part">
            <div class="full-content">
                <img src="1.jpg" id="topMainImage" class="base-image" alt="背景畫面">
                <div class="backdrop" id="topBackdrop"></div>
                <img src="" id="topDialog" class="dialog-overlay" alt="對話框">
            </div>
        </div>

        <!-- ================= 下半部 (可拖拉區間) ================= -->
        <div class="split-container bottom-part">
            <div class="drag-wrapper" id="scrollContent">
                <div class="full-content">
                    <img src="1.jpg" id="bottomMainImage" class="base-image" alt="背景畫面">
                    <div class="backdrop" id="bottomBackdrop"></div>
                    <img src="" id="bottomDialog" class="dialog-overlay" alt="對話框">
                </div>
            </div>
        </div>

        <!-- 右下角隱藏全螢幕按鈕 -->
        <div class="fullscreen-btn" id="fullscreenBtn"></div>
    </div>

    <script>
        const container = document.getElementById('container');
        const scrollContent = document.getElementById('scrollContent');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // 新增：動態計算精準的容器高度，避免 100dvh 在部分手機瀏覽器縮放時產生底部黑邊
        const updateAppHeight = () => {
            const h = container.clientHeight;
            document.documentElement.style.setProperty('--app-height', `${h}px`);
        };
        window.addEventListener('resize', updateAppHeight);
        updateAppHeight(); // 初始執行一次

        // 自動從 CSS :root 中讀取設定變數作為 JS 判斷依據
        const rootStyles = getComputedStyle(document.documentElement);
        const DRAG_START_Y = parseInt(rootStyles.getPropertyValue('--drag-start-y').trim());

        // 取得上、下兩個區塊的元素，以同步狀態
        const topMainImage = document.getElementById('topMainImage');
        const topBackdrop = document.getElementById('topBackdrop');
        const topDialog = document.getElementById('topDialog');

        const bottomMainImage = document.getElementById('bottomMainImage');
        const bottomBackdrop = document.getElementById('bottomBackdrop');
        const bottomDialog = document.getElementById('bottomDialog');
        
        const topLeftZone = document.getElementById('topLeftZone');
        const zeroOverlay = document.getElementById('zeroOverlay');

        // 預先載入圖片
        const img0 = new Image(); img0.src = '0.jpg';
        const img3 = new Image(); img3.src = '3.png';
        const img4 = new Image(); img4.src = '4.jpg';

        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            const docEl = document.documentElement; 
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // --- 0.jpg 切換邏輯 ---
        // 點擊左上角返回區塊 (顯示 0.jpg)
        topLeftZone.addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止事件往下傳遞給 container 觸發核銷
            if (isSignificantDrag) return;
            zeroOverlay.classList.add('show');
        });

        // 點擊 0.jpg 畫面任意區域 (隱藏 0.jpg 並重置狀態)
        zeroOverlay.addEventListener('click', (e) => {
            e.stopPropagation(); // 攔截點擊，不觸發下方 container 的核銷
            zeroOverlay.classList.remove('show');
            
            // 強制重置回初始狀態 (回到 1.jpg)
            currentStep = 0;
            topMainImage.src = '1.jpg';          
            bottomMainImage.src = '1.jpg';
            
            // 確保隱藏所有對話框與遮罩
            topBackdrop.classList.remove('show');    
            bottomBackdrop.classList.remove('show'); 
            topDialog.classList.remove('show'); 
            bottomDialog.classList.remove('show'); 
            
            // 確保拖曳位移歸零
            scrollContent.style.transition = 'none';
            scrollContent.style.transform = `translateX(0px)`;
            currentTranslate = 0;
        });

        // --- 橫向拖動與橡皮筋回彈 (X軸) 邏輯 ---
        let startX = 0;
        let startY = 0;
        let currentTranslate = 0;
        let isDragging = false;
        let isSignificantDrag = false; 
        // 標記這一次的觸控是否在禁止拖拉的頂部區域開始
        let isStartedInForbiddenZone = false;

        const startDrag = (x, y) => {
             // 如果起始點在 START_Y 以上 (0~130px)，標記並直接中斷，不允許拖曳
            if (y < DRAG_START_Y) {
                isStartedInForbiddenZone = true;
                return;
            }

            isStartedInForbiddenZone = false;
            startX = x;
            startY = y;
            isDragging = true;
            scrollContent.style.transition = 'none';
        };

        const moveDrag = (x) => {
            if (!isDragging || isStartedInForbiddenZone) return;
            const deltaX = x - startX;

            // 只要 X 軸移動超過 5px，就判定是拖曳，不要觸發點擊核銷
            if (Math.abs(deltaX) > 5) {
                isSignificantDrag = true;
            }

            // 加入摩擦力 (0.4) 產生橡皮筋左右拉扯感
            currentTranslate = deltaX * 0.4;
            scrollContent.style.transform = `translateX(${currentTranslate}px)`;
        };

        const endDrag = () => {
            isStartedInForbiddenZone = false; // 重置標記
            if (!isDragging) return;
            isDragging = false;
            
            // X軸平滑回彈特效
            scrollContent.style.transition = 'transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1)';
            scrollContent.style.transform = `translateX(0px)`;
        };

        // 檢查是否允許拖曳 (只有狀態 0 和 3 允許，也就是 1.jpg 和 4.jpg 的時候)
        const canDrag = () => {
            return currentStep === 0 || currentStep === 3;
        };

        // 觸控事件綁定
        container.addEventListener('touchstart', (e) => {
            isSignificantDrag = false; // 每次觸碰螢幕先重置拖拉判斷
            if (!canDrag()) return; // 狀態不允許時，直接略過不處理拖曳

            if (e.touches.length === 1) {
                startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        
        container.addEventListener('touchmove', (e) => {
            if(isDragging) moveDrag(e.touches[0].clientX);
        }, { passive: true });
        
        container.addEventListener('touchend', endDrag);

        // 電腦滑鼠測試事件綁定
        container.addEventListener('mousedown', (e) => {
            isSignificantDrag = false;
            if (!canDrag()) return; 
            
            startDrag(e.clientX, e.clientY);
        });
        container.addEventListener('mousemove', (e) => {
            if(isDragging) moveDrag(e.clientX);
        });
        window.addEventListener('mouseup', endDrag);

        // --- 狀態同步邏輯 (同步更新上、下兩等分的圖形) ---
        let currentStep = 0;

        container.addEventListener('click', () => {
            // 如果剛剛使用者在拖拉，阻擋點擊觸發
            if (isSignificantDrag) return; 

            if (currentStep === 0) {
                // 【第 1 次點擊】同步顯示對話框
                topDialog.src = '2.png';
                bottomDialog.src = '2.png';
                
                topBackdrop.classList.add('show');
                bottomBackdrop.classList.add('show');      
                
                topDialog.classList.add('show');   
                bottomDialog.classList.add('show');   
                
                currentStep = 1;
            } 
            else if (currentStep === 1) {
                // 【第 2 次點擊】同步切換按下狀態
                topDialog.src = '3.png';
                bottomDialog.src = '3.png';
                currentStep = 2;

                setTimeout(() => {
                    topBackdrop.classList.remove('show');    
                    bottomBackdrop.classList.remove('show'); 
                    
                    topDialog.classList.remove('show'); 
                    bottomDialog.classList.remove('show'); 
                    
                    setTimeout(() => {
                        // 同步切換最終完成圖片
                        topMainImage.src = '4.jpg';          
                        bottomMainImage.src = '4.jpg';          
                        currentStep = 3;                  
                    }, 200); 
                }, 200); 
            }
        });
    </script>

</body>
</html>
